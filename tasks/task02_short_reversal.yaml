# 任务卡 02 · 短期反转
task_id: task02_short_reversal
name: 短期反转
category: 量价/截面经典效应
status: open

core_question:
  - 过去一个月跌得最多的股票,在扣除 T+1、一字涨跌停、停牌与往返约 0.30% 的成本之后,
    是否仍具有可交易的截面选股能力?
  - 还是说 A 股的短期反转已被机构化与量化拥挤消耗,剩下的那部分恰好落在合同已剔除的
    微盘与 ST 段内——即"效应为真,但不在可投域里"?

economic_rationale: >
  短期反转有两条互不排斥的来源。其一是流动性提供补偿——承接恐慌抛压的一方要求回报,
  价格被抛压推过头后回归,反转收益是承接的报酬而非预测能力。其二是过度反应——
  噪声交易者对消息反应过度,随后被修正。A 股的放大器在于散户成交占比高,
  且 T+1 与涨跌停制度把抛压在时间上拉长,过冲更容易发生。
  可证伪的对立假设有三条。(a) 换皮假设——反转只是换手率/流动性因子的另一种写法,
  控制换手后 IC 归零。(b) 可投域假设——反转强度随市值下降而上升,本合同剔除
  流通市值低于 20 亿与 ST 之后,最肥的一段已经不在池内,剩余部分不足以覆盖成本。
  (c) 不可兑现假设——跌幅最大的一端正是最可能一字跌停或停牌的一端,T+1 下买不进,
  纸面收益无法实现;任务卡01 已在突破形态上见过同型失败,此处必须独立复核而非假定不同。

allowed_data: [adj_close, close, tradestatus, volume, turn, float_mcap]
# turn 与 float_mcap 只用于对照诊断(换手换皮、市值依赖),不进入因子本体

known_dead_ends:
  - 2017 年后衰减是公开研究的普遍报告,常见归因为机构化、量化产品同质化与策略拥挤。
    因此"用全样本均值宣称有效"会被 2017 年之前的高收益段拉高,分段报告是必需项而非可选项。
  - 微盘依赖——反转强度随市值下降而上升。合同已剔除流通市值低于 20 亿与 ST,
    等于切掉该效应最肥的一段;若只在被剔除段内成立,结论应写成"有效但不在可投域内",
    而不是"有效"。
  - 换手率换皮——反转与换手/流动性高度相关,不做换手控制的正结果不可采信。
  - 停牌复牌跳价会被误读为新的反转信号。因子用 MAX_STALE_DAYS 桥接加"窗口内最少成交日占比"
    两道闸拦截,但长停牌股复牌后的首段仍应视为可疑样本。
  - 一字跌停不可买——跌幅最大的一端正是最可能封死跌停的一端。回测器已执行 can_buy,
    但任务卡仍须单独报告"因买不进而被迫放弃的目标权重占比",否则 IC 与净值会讲两个不同的故事。
  - 信号已被压到两日时滞——引擎执行链是 factor[t] 到 t+1 开盘建仓,主口径 skip=1 再压一天,
    合计两个交易日。若结论为负,必须先用 skip=0 的对照排除"是时滞吃掉了信号",
    再谈"效应消失",否则把执行口径的代价错记成经济结论。

hypotheses:                      # 拉数据前写死,不得事后调整
  H1: 对齐可交易收益(t+1 开盘到 t+2 开盘)的 RankIC 均值超越逐日截面打乱零分布的 95 分位
  H2: 多头组(因子前10%)相对中证500 的超额夏普超越零分布 95 分位,且超额年化收益为正
  H3: 2017-01-01 之后子样本的 IC 均值不低于 2017-01-01 之前子样本 IC 均值的一半

falsification: >
  H1 不成立 → 该因子在本可交易口径下不具截面选股能力,结论为负,存档不再扩展。
  H2 不成立(含"零校准通过但超额年化不为正"的情形)→ 有微弱截面信息但不可交易,
  与任务卡01 同型;H2 的两条判据必须并用,因为任务卡01 实测过"零校准 5/5 通过却年亏 20%",
  只用零校准会把亏损因子判成立,只用固定阈值又对零假设不设防。
  H3 不成立 → 结论限定为"历史有效、近段衰减",任何面向当下的部署主张作废,
  且不得再用全样本均值作为结论;H3 成立则"拥挤致衰减"的流行叙事在本口径下被证伪,
  这同样是一条值得交付的结果。
  补充判据——若剔除"建仓日一字跌停或停牌而买不进"的标的后超额收益衰减超过一半,
  则判为"效应真但不可兑现",与 H2 不成立同等处理。

notes: >
  预注册的参数集合(只在集合内扫描,不事后挑最好的一组)——window 取 5/10/20,skip 取 0/1;
  主口径为 window=20、skip=1;其余为稳健性对照,全部结果一并披露,试验次数计入 DSR。
  skip 的对照直接回答一个执行问题——反转信息是否集中在最近一个交易日;若集中,
  那么在本引擎的 T+1 执行链下它本来就不可交易,这是口径结论而非因子失败。
  必须报告的诊断(不进入判据,但进入交付物)——日均在池只数、日均有效因子只数、
  多头组平均换手、因不可买而放弃的目标权重占比、多头组的流通市值与换手率中位数分位。
  样本限制——全量同步完成前,库内股票按代码顺序同步,是非随机子集;
  任何结果只能写成"流水线机械验证通过",不得外推为市场结论。负结果照实记录。

trials_declared:             # 每一档都是一次独立试验,须计入 gates.evaluate 的 n_trials
  # 预注册:window ∈ {5,10,20} × skip ∈ {0,1} = 6 档(未跑的档也计入,代价按申报收取)
  preregistered: 6
  # 事后追加(2026-09-21,BATCH01 观察到"IC 强但年亏"之后提出):主口径每 5 / 20 日调仓
  post_hoc: 2

amendments:
  - date: "2026-09-21"
    kind: post_hoc
    change: 新增 short_reversal_hold5 / short_reversal_hold20(主口径降低调仓频率)
    reason: BATCH01 中主口径 IC 显著而扣费后年化为负,需区分"信号弱"与"换手成本过高"
    constraint: 看过数据后提出,只能生成假设不能确认假设;正结果须另立任务卡,在保留段独立复核
  - date: "2026-09-21"
    kind: preregistered_control
    change: 新增 short_reversal_skip0(预注册参数集内的对照,此前未执行)
    reason: 本卡规定主口径为负时须先以 skip=0 排除"时滞吃掉信号"
  - date: "2026-09-21"
    kind: method_change
    commit: 1dffd28
    change: >-
      零分布构造由"逐日截面独立打乱"改为"全样本固定股票置换"(只摧毁"哪只股票拿哪个值",保留时序路径与换手)。
    reason: >-
      逐日独立打乱同时摧毁时序路径:零样本日换手 0.85,真实因子 0.009,
      低换手因子在收益类指标上自动"超越零分布",比较的是手续费而非选股能力。首批结果(BATCH01)据此撤回。
    affects: >-
      H1、H2(原文"逐日截面打乱零分布的 95 分位")
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: 4ab2a8c
    change: >-
      基准收益改为与组合同一时段"开盘→次日开盘"(原为基准"前收→当日收盘",与组合只在 t 日盘中重叠);
      旧口径另存 *_cc_legacy 仅作对照。
    reason: >-
      时段错位虚增超额方差、系统性压低超额夏普:实测中证1000 对中证500 跟踪误差 16.3% → 7.0%,
      超额方差的 81.5% 来自错位。该缺陷发现于看过结果之后;修正对全部因子与零分布一律生效,门槛数值不变。
    affects: >-
      H2(相对中证500 的超额夏普与超额年化)
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: a15a404
    change: >-
      (1) 零分布改为按生命周期(首/末有效日)分组、组内循环错位指派的固定 donor,整条序列照搬;
      新增零分布有效性闸门:零样本换手中位数 / 真实换手须在 [0.8, 1.25],否则主判据按不通过处理。
      (2) "超越零分布 95 分位"改为 Phipson-Smyth 经验 p 值 (1 + 零样本不劣于真实值的个数) / (n + 1) ≤ 0.05。
      (3) 合同 v2:涨跌停价按分四舍五入后判定;创业板 2020-08-24 前涨跌幅 10%;
      卖出印花税按日期取值(2023-08-28 前 0.1%);退市时仍未卖出的持仓按 delisting_haircut=1.0 清算。
    reason: >-
      第二版构造(整列置换 + 逐行恢复缺失)在真实数据上退化为近似逐日打乱,零样本换手为真实的 2.2–13.4 倍;
      插值 q95 判据在 n=50 时单指标假阳性约 6.8%;合同 v1 四处交易规则均偏乐观
      (2019 年主板一字涨停漏判约 41%、改革前创业板涨跌停全漏、印花税低估覆盖样本 89.5% 的交易日、退市持仓零损失)。
    affects: >-
      H1、H2 的零校准判据与全部回测指标
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
