# 任务卡 03 · 特质波动率(低波异象)
task_id: task03_idio_volatility
name: 特质波动率
category: 风险类/截面经典效应
status: open

core_question:
  - 低波异象在本合同的可投域(剔除 ST、次新、流通市值低于 20 亿)内是否存在,
    且在扣除 T+1 与成本之后仍留有可交易的多头超额?
  - 还是说它只是市值因子换皮——低波组基本就是大市值组,所谓超额不过是
    大小盘风格轮动的会计结果?

economic_rationale: >
  低波异象有两条经典来源。其一是杠杆约束(betting-against-beta)——
  许多资金被禁止或不愿加杠杆,只能靠超配高 beta、高波动资产去追求高收益,
  从而推高其价格、压低其预期回报;能够加杠杆的一方做多低波即可收取这份补偿。
  其二是彩票偏好——投资者对"小概率暴涨"有系统性偏好,愿意为高波动、高右偏的股票多付钱,
  高波组因而被高估。A 股散户成交占比高,理论上第二条渠道更强。
  可证伪的对立假设有三条。(a) 市值换皮——A 股的高波与小市值高度相关,低波组近似大市值组,
  因子收益只是 2017-2021 大盘风格与 2021-2023 小盘风格轮动的结果,不是独立 alpha。
  (b) beta 换皮——低波组合的 beta 小于 1,相对中证500 的"超额"在下跌年份天然为正、
  上涨年份天然为负,这是市场暴露的会计效果,不是选股能力。
  (c) 特质化不彻底——本口径只扣掉单一市场代理,缺 SMB/HML,残差中仍留有规模与风格暴露,
  所谓"特质"波动其实仍含系统性成分。三条都必须被单独检验,不得因为因子名里有"特质"二字
  就默认已排除。

allowed_data: [adj_close, close, tradestatus, volume, float_mcap, bench_close]
# bench_close = 指数收盘价(主基准中证500),用作市场代理;缺失时退化为当日截面等权平均收益
# float_mcap 只用于 H3 的市值换皮诊断,不进入因子本体

known_dead_ends:
  - 市值换皮是本卡最大的风险,必须单独检验,不得默认已排除。A 股波动率与流通市值负相关强,
    低波因子很可能只是"买大市值";而市值风格在样本期内多次反转(2017-2020 大盘占优、
    2021-2023 小盘占优、2024-01 微盘流动性危机),一个市值换皮的低波因子会表现出
    强烈的分段不稳定,却可能在全样本均值上看起来正常。判据见 H3。
  - 与上一条配套的取样陷阱——合同已剔除流通市值低于 20 亿,可投域的市值跨度本就被截断,
    这会同时削弱真实的低波效应与市值换皮的表现。当前库内样本(按代码顺序同步,
    以沪市主板老股为主)实测低波因子与流通市值的日均截面秩相关仅约 +0.04,
    这个数字不能当作"已排除换皮"的证据——它同样可能只说明样本的市值跨度太窄。
    该诊断必须在全量同步完成后重算。
  - beta 与 alpha 混淆——多头超额若全部来自 beta 小于 1,则在任何下跌年份都会"有效",
    这不是选股能力。须同时报告多头组相对中证500 的 beta 与 beta 调整后的超额。
  - 价格冻结伪装成低波——长停牌与连续一字板会让个股收益恒为零,算出极低甚至为零的波动,
    取负后排在多头组最前。因子已设两道闸(估计量为正,且个股自身收益标准差为正),
    其中第二道闸是自测实测发现的必需项——excess 口径把 beta 固定为 1,冻结股的超额收益
    等于市场收益的相反数,标准差恰好等于市场自身波动,只查"波动大于零"拦不住。
    但复牌后的首段仍应视为可疑样本。
  - 单因子残差不等于特质——免费数据下没有现成可靠的 SMB/HML 因子收益序列,
    本口径的"特质"只是扣掉市场代理后的残差。这是数据边界而非已解决的问题,须在结论中披露。
  - 频率口径分歧——低波异象在月频调仓的文献中最强;本引擎为日频信号、窗口 60 日,
    换手更高、成本侵蚀更重。日频不成立不能推断月频也不成立,反之亦然;
    结论必须带上调仓频率的限定词。

hypotheses:                      # 拉数据前写死,不得事后调整
  H1: 对齐可交易收益(t+1 开盘到 t+2 开盘)的 RankIC 均值超越逐日截面打乱零分布的 95 分位
  H2: 多头组(因子前10%)相对中证500 的超额夏普超越零分布 95 分位,且超额年化收益为正
  H3: 因子与流通市值的日均截面秩相关绝对值小于 0.5,且把可投域按流通市值三等分后,
      三层内的 IC 均值同号、并有至少两层超越各自的零分布 95 分位

falsification: >
  H1 不成立 → 低波在本可交易口径下不具截面选股能力,结论为负,存档不再扩展。
  H2 不成立 → 有截面信息但不可交易;此处同样两条判据并用,理由与任务卡02 相同——
  只用零校准会把亏损因子判成立,只用固定阈值又对零假设不设防。
  H3 不成立 → 低波在本口径下不是独立因子,而是市值或风格的换皮,
  结论降级为"与市值高度重合,不单独立项",并转由组合层判断是否还有增量。
  补充判据——若多头组 beta 调整后的超额年化不为正,则判为"超额来自低 beta 而非选股能力",
  与 H2 不成立同等处理。

notes: >
  预注册的参数集合(只在集合内扫描,不事后挑最好的一组)——window 取 20/60,
  mode 取 capm/excess/total;主口径为 window=60、mode=capm,市场代理取中证500。
  mode 的对照直接回答"特质化这一步是否有增量"——若 total 与 capm 结论一致,
  说明在本可投域内扣市场没有带来信息,应当取更简单的口径并如实说明。
  必须报告的诊断(不进入判据,但进入交付物)——多头组的流通市值与换手率中位数分位、
  多头组 beta、分年度超额、合同四段危机窗口内的表现、日均有效因子只数。
  与任务卡02 的关系——反转与低波若截面秩相关过高,两者不应被当作两次独立试验计入 DSR,
  组合层须先评估增量再决定是否并行。当前样本实测两者日均截面秩相关约 +0.04(同样受样本非随机所限)。
  样本限制——全量同步完成前,库内股票按代码顺序同步,是非随机子集;
  任何结果只能写成"流水线机械验证通过",不得外推为市场结论。负结果照实记录。

trials_declared:             # 每一档都是一次独立试验,须计入 gates.evaluate 的 n_trials
  # 预注册:window ∈ {20,60} × mode ∈ {capm,excess,total} = 6 档(未跑的档也计入)
  preregistered: 6
  # 事后追加(2026-09-21,对抗审查发现主口径与总波动秩相关 0.966 之后):纯低换手对照
  post_hoc: 1

amendments:
  - date: "2026-09-21"
    kind: post_hoc
    change: 新增 low_turnover_control(纯低换手)对照
    reason: 审查发现主口径与总波动截面秩相关 0.966、与纯低换手 0.527,需检验"特质"是否真的发生
    constraint: 对照组只用于否证,不作为候选因子;若主口径与对照差异不显著,裁定写明"本口径无法区分 IVOL 与低换手"
  - date: "2026-09-21"
    kind: method_change
    commit: 1dffd28
    change: >-
      零分布构造由"逐日截面独立打乱"改为"全样本固定股票置换"(只摧毁"哪只股票拿哪个值",保留时序路径与换手)。
    reason: >-
      逐日独立打乱同时摧毁时序路径:零样本日换手 0.85,真实因子 0.009,
      低换手因子在收益类指标上自动"超越零分布",比较的是手续费而非选股能力。首批结果(BATCH01)据此撤回。
    affects: >-
      H1、H2、H3(原文"逐日截面打乱零分布的 95 分位""各自的零分布 95 分位")
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: 4ab2a8c
    change: >-
      基准收益改为与组合同一时段"开盘→次日开盘"(原为基准"前收→当日收盘",与组合只在 t 日盘中重叠);
      旧口径另存 *_cc_legacy 仅作对照。
    reason: >-
      时段错位虚增超额方差、系统性压低超额夏普:实测中证1000 对中证500 跟踪误差 16.3% → 7.0%,
      超额方差的 81.5% 来自错位。该缺陷发现于看过结果之后;修正对全部因子与零分布一律生效,门槛数值不变。
    affects: >-
      H2(相对中证500 的超额夏普与超额年化)与补充判据中的 beta 调整超额
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: a15a404
    change: >-
      (1) 零分布改为按生命周期(首/末有效日)分组、组内循环错位指派的固定 donor,整条序列照搬;
      新增零分布有效性闸门:零样本换手中位数 / 真实换手须在 [0.8, 1.25],否则主判据按不通过处理。
      (2) "超越零分布 95 分位"改为 Phipson-Smyth 经验 p 值 (1 + 零样本不劣于真实值的个数) / (n + 1) ≤ 0.05。
      (3) 合同 v2:涨跌停价按分四舍五入后判定;创业板 2020-08-24 前涨跌幅 10%;
      卖出印花税按日期取值(2023-08-28 前 0.1%);退市时仍未卖出的持仓按 delisting_haircut=1.0 清算。
    reason: >-
      第二版构造(整列置换 + 逐行恢复缺失)在真实数据上退化为近似逐日打乱,零样本换手为真实的 2.2–13.4 倍;
      插值 q95 判据在 n=50 时单指标假阳性约 6.8%;合同 v1 四处交易规则均偏乐观
      (2019 年主板一字涨停漏判约 41%、改革前创业板涨跌停全漏、印花税低估覆盖样本 89.5% 的交易日、退市持仓零损失)。
    affects: >-
      H1–H3 的零校准判据与全部回测指标
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
