# 任务卡 04 · Amihud 非流动性(收益冲击 / 成交额)
task_id: task04_illiquidity
name: Amihud非流动性
category: 流动性
status: open
factor_module: ashare_forge/factors/illiquidity.py

core_question:
  - 单位成交额推动价格的幅度(非流动性)是否具有横截面选股能力?
  - 还是说它只是流通市值的单调变换——非流动性溢价实为小市值溢价换皮?
  - 在合同已剔除 ST、次新、流通市值<20亿之后,剩余样本内是否还有可交易的非流动性补偿?

economic_rationale: >
  Amihud(2002)的非流动性溢价假说:交易一只股票的冲击成本越高,持有者要求的预期收益越高,
  差额是对未来变现成本的补偿。在 A 股还有一条同向的本土证据链——换手率因子长期为负,
  即高换手(高流动性、高投机度)的股票后续收益偏低;低换手股对应低成交额、高 Amihud 值。
  两条逻辑指向同一符号,故方向可以在拉数据前单一申报,不留事后挑符号的余地。
  可证伪的对立假设:(a) 该因子只是流通市值的代理,市值中性化后信息归零;
  (b) 冲击成本本身就是交易成本——即便毛收益为正,按合同的单边 0.125% 成本(对流动性最差的
  一端其实还偏乐观)扣完后净额为负,属因子真但不可交易;
  (c) 在 T+1 与涨跌停约束下,最不流动的一端恰恰是买不进、卖不掉的那一端。

direction_declaration:                 # 拉数据前写死,不得事后调整
  sign: +1
  meaning: 因子值 = +Amihud ILLIQ;组合做多 ILLIQ 最大(最不流动)的一端
  basis:
    - Amihud(2002)非流动性溢价:预期收益对冲击成本的补偿为正
    - A股换手率因子长期为负,低换手≈低成交额≈高ILLIQ,与上条同向
  if_sign_flips: >
    若实测符号为负,不得改方向重跑充作成立,应记为方向假设被证伪,
    并按流动性偏好/拥挤度假说另立任务卡,重新申报方向与试验计数。

allowed_data: [amount, pctChg, tradestatus, float_mcap]   # 均在合同 columns 之内

spec:
  window_days: 20            # 冲击值的滚动均值窗口(含当日;当日数据在收盘时已知,非前视)
  min_obs: 15                # 窗口内有效交易日下限
  denominator: >
    amount(成交额,元),折算为亿元;不用 volume(股数)——同样 1 万股,
    10 元与 100 元的股票资金容量差 10 倍,用股数会把高价股系统性判成更流动。
  return_source: >
    pctChg/100。baostock 的 preclose 即除权参考价(实测 sh.600000 于 2018-07-13 除权:
    preclose=9.47 而前一日 close=9.57),故 pctChg 已含除权调整,且不依赖复权因子表的完整度。
  exclusions:
    - amount<=0 或 tradestatus!=1 的日子整日剔除,不按 0 进分母(否则得到 inf 并顶到排序最前)
    - 要求 t 与 t-1 两日都有成交,避免把跨停牌期的累计涨跌记成单日冲击
  aggregation: 均值(教科书口径)。已知脆弱点:窗口内一根极端冲击日可主导均值,须披露
  lookahead_note: >
    窗口包含当日不构成前视:|r_t| 与 amount_t 在 t 日收盘已知,而建仓在 t+1 开盘。
    任务卡01 中箱顶必须 shift(1) 针对的是另一类结构——被比较的参照水平若含当日价,
    当日突破幅度就恒为正。区别在于当日值是被观测量还是参照系。因果性由
    engine.leakage.prefix_recompute_test 机械验证。

n_trials_if_all_run: 3   # 全部跑完时须传给 gates.evaluate 的试验次数
trials_declared:             # 每一档都是一次独立试验,须计入 gates.evaluate 的 n_trials
  - {id: T1, builder: build_factor, note: 主口径 win=20}
  - {id: T2, builder: build_factor_size_neutral, note: 市值中性化残差,直接回答已知死路}
  - {id: T3, builder: "make_builder(win=60, min_obs=40)", note: 窗口稳健性}

known_dead_ends:
  - >
    非流动性与市值高度相关,可能只是小市值换皮。实测(2019-01-02→2024-08-30,库内 611 只)
    ILLIQ 与流通市值的日均截面秩相关 = -0.84,共同变动约七成。因此主口径单独跑出正结果
    不足以立论,必须与 build_factor_size_neutral 并列汇报:中性化后若信息归零,
    结论应写成「非流动性无独立信息,原始效应由市值承担」。
    中性化后残差与市值的秩相关降至 -0.08;不为 0 是因为残差只对市值秩做了线性正交,
    单调非线性部分仍有残留,这一点须在结论中披露,不得宣称完全中性。
    (该相关系数随样本扩大稳定:库内 413 只时 -0.85,611 只时 -0.84。)
  - >
    非流动性因子的回测收益与冲击成本是同一件事的两面:因子值最高的一端,正是实际冲击成本
    被合同固定值(单边 0.1%)低估得最多的一端。故毛收益为正而净收益为负是本因子的典型归宿,
    须按平静/危机分层复核成本敏感性(成本翻倍档,见 H4)。
  - >
    合同已剔除流通市值<20亿与次新股,天然砍掉了 Amihud 效应最强的尾部;
    本卡的结论只对「流通市值20亿以上、上市满120交易日、非ST」的池子成立,不得外推到全市场。
  - >
    本库 adj_factor 表覆盖远落后于 daily 表,adj_close 对多数股票退化为原始 close;
    故本因子的收益口径改用 pctChg(已含除权调整),不依赖复权因子表。
    但回测器 backtest 仍用 adj_close 算持仓收益,该处的偏差不在本卡可控范围内,须一并披露。

hypotheses:                            # 拉数据前写死
  H1: 主口径 RankIC 超越零分布 95 分位(具有真实截面选股能力)
  H2: 多头组相对中证500 的超额夏普超越零分布 95 分位
  H3: 市值中性化后(T2),RankIC 仍超越其自身的零分布 95 分位
  H4: 把合同成本翻倍(单边 0.25%)后,多头超额年化仍为正

falsification: >
  H1 或 H2 不成立 → 该因子在本口径下不具可交易的截面选股能力;
  H3 不成立 → 非流动性无独立于市值的信息,记为市值代理,结论按此写,不得只报主口径;
  H4 不成立 → 记为因子真但被自身的交易成本吃掉,属不可交易。
  另:零假设校准通过不等于赚钱(任务卡01 实测过零校准 5/5 通过却年亏 20%),
  绝对门槛与零分布判据必须并列呈现。

next_steps:
  - 若 T2 通过:换用 turn(换手率)构造对照因子,分离「成交额低」与「换手低」两条路径。
  - 若 T2 不通过:本族转入存档,不再追加试验(追加只会白白抬高 DSR 门槛)。
  - 冲击成本口径的根治:用按成交额分档的冲击模型替代合同固定 0.1%,当前值对最不流动一端偏乐观。

sample_limitation: >
  截至本卡撰写时,库内约 300~420 只股票(全市场 5322 只的一部分),且全量同步按代码顺序进行,
  当前样本集中于沪市主板老股,为非随机样本。该样本足以做流水线的机械验证(因果性、覆盖度、量纲),
  不足以支撑任何关于因子有效性的研究结论;所有数值结论须在全量同步完成后复跑。

notes: >
  本卡的交付价值在于给非流动性溢价这一教科书因子一个在 A 股可交易约束下的可复核裁定,
  以及把「它是不是小市值换皮」这个问题用市值中性化残差正面回答。负结果同样是交付物。

amendments:                  # 方法修订记录:只追加,不改假设原文
  - date: "2026-09-21"
    kind: method_change
    commit: 1dffd28
    change: >-
      零分布构造由"逐日截面独立打乱"改为"全样本固定股票置换"(只摧毁"哪只股票拿哪个值",保留时序路径与换手)。
    reason: >-
      逐日独立打乱同时摧毁时序路径:零样本日换手 0.85,真实因子 0.009,
      低换手因子在收益类指标上自动"超越零分布",比较的是手续费而非选股能力。首批结果(BATCH01)据此撤回。
    affects: >-
      H1、H2、H3(原文"零分布 95 分位")
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: 4ab2a8c
    change: >-
      基准收益改为与组合同一时段"开盘→次日开盘"(原为基准"前收→当日收盘",与组合只在 t 日盘中重叠);
      旧口径另存 *_cc_legacy 仅作对照。
    reason: >-
      时段错位虚增超额方差、系统性压低超额夏普:实测中证1000 对中证500 跟踪误差 16.3% → 7.0%,
      超额方差的 81.5% 来自错位。该缺陷发现于看过结果之后;修正对全部因子与零分布一律生效,门槛数值不变。
    affects: >-
      H2(相对中证500 的超额夏普)与 H4(成本翻倍后的多头超额年化)
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: a15a404
    change: >-
      (1) 零分布改为按生命周期(首/末有效日)分组、组内循环错位指派的固定 donor,整条序列照搬;
      新增零分布有效性闸门:零样本换手中位数 / 真实换手须在 [0.8, 1.25],否则主判据按不通过处理。
      (2) "超越零分布 95 分位"改为 Phipson-Smyth 经验 p 值 (1 + 零样本不劣于真实值的个数) / (n + 1) ≤ 0.05。
      (3) 合同 v2:涨跌停价按分四舍五入后判定;创业板 2020-08-24 前涨跌幅 10%;
      卖出印花税按日期取值(2023-08-28 前 0.1%);退市时仍未卖出的持仓按 delisting_haircut=1.0 清算。
    reason: >-
      第二版构造(整列置换 + 逐行恢复缺失)在真实数据上退化为近似逐日打乱,零样本换手为真实的 2.2–13.4 倍;
      插值 q95 判据在 n=50 时单指标假阳性约 6.8%;合同 v1 四处交易规则均偏乐观
      (2019 年主板一字涨停漏判约 41%、改革前创业板涨跌停全漏、印花税低估覆盖样本 89.5% 的交易日、退市持仓零损失)。
    affects: >-
      H1–H3 的零校准判据与 H2、H4 所用的全部回测指标
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: aef7cff
    change: >-
      T2(build_factor_size_neutral)的市值中性化由"ILLIQ 截面秩对市值截面秩做线性回归取残差"
      改为"市值十分组内重新排序"。known_dead_ends 中"残差只对市值秩做了线性正交"的描述对应旧做法。
    reason: >-
      二者关系非线性,线性残差与市值的 Spearman 仍为 −0.209(2019–2021),不能读作"剔除市值后";
      十分组后为 −0.017。
    affects: >-
      H3(市值中性化后的 RankIC)
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
