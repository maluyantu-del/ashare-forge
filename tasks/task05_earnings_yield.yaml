# 任务卡 05 · 盈利收益率 E/P(估值/质量)
task_id: task05_earnings_yield
name: 盈利收益率E/P
category: 估值质量
status: open
factor_module: ashare_forge/factors/earnings_yield.py

core_question:
  - 盈利收益率(E/P = 1/peTTM)高的股票后续是否跑赢?即 A 股是否存在可交易的价值溢价?
  - 用 B/P(1/pbMRQ)作对照:起作用的是盈利便宜还是账面便宜?
  - 把估值字段整体滞后一个月乃至三个月后,信号是否仍在?——这是对数据前视的自检。

economic_rationale: >
  价值溢价的标准解释:高 E/P 意味着单位价格买到更多当期盈利,若市场对盈利的持续性定价过低,
  持有高 E/P 组合可获得均值回复的补偿;风险解释则认为高 E/P 是困境风险的定价,溢价是风险报酬。
  可证伪的对立假设:(a) A 股的价值溢价在 2017-2021 的成长风格中长期为负,若样本内正结果
  完全由个别片段贡献,则属区制依赖而非稳定因子;
  (b) E/P 的截面差异主要由行业构成决定(银行/地产天然高 E/P),行业中性化后归零;
  (c) 正结果来自 peTTM 的发布时滞——即因子值提前知道了尚未公告的盈利。

direction_declaration:                 # 拉数据前写死,不得事后调整
  sign: +1
  meaning: 因子值 = +E/P;组合做多盈利收益率最高(估值最低)的一端
  basis: 价值溢价(Basu 1977 以来的标准结论);A股上亦有长周期证据,但存在明确的失效区间
  if_sign_flips: >
    若实测符号为负,记为「A股本样本期内价值溢价为负」,按成长/景气对立假设另立任务卡,
    不得在本卡内改方向重跑充作成立。

allowed_data: [peTTM, pbMRQ]           # 合同 columns.valuation;不使用任何财务报表原始科目

negative_pe_handling:                  # 本卡的核心实现要点
  problem: >
    价值因子最常见的实现错误:直接按 peTTM 升序取最低 PE 当便宜货。亏损公司 peTTM 为负,
    升序时全部排在最前,低估值组合实际变成亏损股组合,回测结果由壳价值、重组预期与退市风险
    驱动,与估值无关。实测(2019-01-02→2024-08-30,库内 611 只)每日平均 21.0%、
    最高 27.8% 的标的 peTTM<0,占比足以主导整个组合。
  solution: >
    取倒数 E/P = 1/peTTM。E/P 在盈利跨过零点时连续且单调:E 从正变负,E/P 连续穿 0 变负,
    亏得越多越负;而 PE=P/E 在 E→0 处有极点,微亏(PE=-10000)反而排在巨亏(PE=-1)之后,
    顺序是错的。取倒数同时修掉极点与排序方向,负值无需剔除即自然落在最差一端。
  edge_cases:
    - peTTM 恰为 0 与 ±inf 一律置 NaN(本库实测 0 行,但接口无保证)
    - >
      默认不做截面缩尾(WINSOR_Q=0):下游 nlargest 与秩指标对单调变换免疫,
      而缩尾会在两端造并列值,nlargest 遇并列按列顺序取前 k → 退化为按股票代码字母序选股。
    - drop_negative=True 提供仅正盈利档,用于检验 IC 是否全靠亏损股尾巴撑起(见 H4)
  pb_same_rule: B/P = 1/pbMRQ 同理;负净资产约占 0.4%,同样自然落到最差端

pit_risk:                              # 本卡最大的不可辩护点,必须披露
  statement: >
    baostock 的 peTTM/pbMRQ 是日频快照字段,peTTM 字段本身不带发布日;发布日须另从
    query_profit_data(pubDate/statDate)取;切换时点的实证见 docs/PIT-VALUATION-AUDIT.md。
    若该字段按报告期末而非披露日切换,则报告期末到披露日之间的因子值含有当时尚未公开的
    盈利数字。这是数据层面的前视,前缀重算检验抓不到——前缀重算只能证明没有用到未来的行,
    不能证明当前行本身没有提前知道未来信息。
    审计结论(2026-09,预注册判据:剔除复权因子变动日、股本变动日与陈旧日后,隐含 EPS/BPS
    在 [报告期末, 首次披露日) 内的未归因跳变记为早跳,早跳比例 ≤ 1% 为通过;抽样 210 对,
    可判定 203 对):peTTM 早跳 4/203 = 1.97%(95% CI 0.54%–4.97%),判定不通过;
    pbMRQ 1/203 = 0.49%,通过。peTTM 的 4 例早跳均不是提前切到本期数值(2 例单日毛刺、
    1 例 0.26% 的小幅修订、1 例来源未核实的同日变动),本期切换日 95.5% 与首次披露日相同;
    业绩快报先于正式报告时,peTTM 在快报日切换,pbMRQ 在正式报告日切换。
    据此,peTTM 的切换时点不获 PIT 认定,lag=0 档(T3)不因该审计获得认可。
    数值是否为首次披露值(追溯重述)该审计测不出,继续作为局限披露。
  mitigation: >
    默认对估值字段统一滞后 VALUATION_LAG_DAYS=20 个交易日(约一个月)。
    季报的报告期末与法定披露截止至少相隔一个月(Q1: 03-31→04-30;Q3: 09-30→10-31),
    滞后 20 日后季报口径不再领先于公开信息;半年报(06-30→08-31)与年报(12-31→04-30)
    的法定窗口更长,故 lag=60 档为必做稳健性(见 H3)。滞后恒为向过去看,不引入新的前视。
  root_fix: >
    用 baostock query_profit_data(含 pubDate/statDate)自建 PIT 盈利表,按 pubDate 对齐后
    自行计算 TTM 与 E/P。属数据层工作,不在本卡范围,已列入 next_steps。

n_trials_if_all_run: 4   # 全部跑完时须传给 gates.evaluate 的试验次数
trials_declared:             # 每一档都是一次独立试验,须计入 gates.evaluate 的 n_trials
  - {id: T1, builder: build_factor, note: 主口径 E/P,lag=20,保留负盈利}
  - {id: T2, builder: build_factor_bp, note: 对照 B/P,lag=20}
  - {id: T3, builder: "make_builder(lag=0)", note: 不滞后档,给出性能上界与前视敏感度}
  - {id: T4, builder: "make_builder(lag=60, drop_negative=True)", note: 长滞后加仅正盈利}

known_dead_ends:
  - >
    A股估值因子在 2017-2021 的成长风格下长期失效(核心资产行情中低估值组合持续跑输)。
    因此全样本平均值会被区制掩盖,必须按年度以及按合同 regimes 的平静-危机分层分别报告;
    只报全样本均值的结论不予采信。
  - >
    peTTM 来自 baostock 为当期快照而非 PIT:存在财报修订与发布时滞导致的前视风险,
    本平台无法完全排除,详见 pit_risk 段。任何正结果都必须与 lag=60 档并列呈现,
    若 lag=60 后信号消失,结论应写成「效应来自披露时点而非估值」。
  - >
    E/P 的截面差异高度依赖行业构成(银行、地产、钢铁天然高 E/P)。本平台无 PIT 行业分类
    (合同已声明行业为当前快照),故无法做行业中性化;这意味着正结果可能只是一次行业押注。
    须在结论中明写该项未被排除,不得以「因子有效」作结。
  - >
    E/P 与非流动性因子(task04)存在明显负相关(实测日均截面秩相关 -0.33,同上样本),
    两卡若同时进组合层,须按组合层的增量准入规则复核,不得重复计入同一条信息。

hypotheses:                            # 拉数据前写死
  H1: 主口径(T1)RankIC 超越零分布 95 分位
  H2: 多头组相对中证500 的超额夏普超越零分布 95 分位
  H3: lag=60 档相对 lag=0 档(T3)的 RankIC 衰减不超过一半
  H4: >
    仅正盈利档的 RankIC 与保留负盈利档同号,且量级不低于其一半;
    若不成立,说明信号由亏损股尾巴驱动,属困境/壳价值而非估值。
  H5: 按年度分解后正贡献不集中于单一年份(最大单年贡献占比 < 50%)

falsification: >
  H1 或 H2 不成立 → 该因子在本口径下不具可交易的截面选股能力;
  H3 不成立 → 效应来自披露时点(数据前视嫌疑),结论不得写成估值有效;
  H4 不成立 → 效应来自亏损股尾巴,应改立困境反转任务卡重新申报;
  H5 不成立 → 记为区制依赖,不得作为稳定因子进组合层。
  绝对门槛与零分布判据必须并列呈现:任务卡01 已实测零校准 5/5 通过却年亏 20%。

next_steps:
  - >
    数据层:用 query_profit_data 的 pubDate 自建 PIT 盈利表,彻底消除发布时滞——
    这同时是本仓库所有基本面因子的公共前置,优先级应高于继续加估值变体。
  - 若 H1-H5 全通过:与 task04 做组合层增量准入,检验两者是否携带重复信息。
  - >
    若 H3 不通过:结论转为「peTTM 字段不具 PIT 可用性」的数据层负结果,
    这本身是对后续所有基本面因子有价值的发现,须单独记录。

sample_limitation: >
  截至本卡撰写时,库内约 300~420 只股票(全市场 5322 只的一部分),且全量同步按代码顺序进行,
  当前样本集中于沪市主板老股,为非随机样本——而老股与主板股的行业构成本身就偏向高 E/P 的
  金融与周期板块,对本卡的偏倚尤其严重。该样本仅可用于流水线的机械验证,
  不足以支撑任何关于因子有效性的研究结论。

notes: >
  本卡的交付价值有两层:一是给 A 股价值因子一个在可交易约束下的可复核裁定;
  二是把「peTTM 能不能当 PIT 用」这个数据层问题用 lag 稳健性正面测出来——
  后者无论正负,都是本仓库所有基本面因子的前置结论。负结果同样是交付物。

amendments:                  # 方法修订记录:只追加,不改假设原文
  - date: "2026-09-21"
    kind: method_change
    commit: 1dffd28
    change: >-
      零分布构造由"逐日截面独立打乱"改为"全样本固定股票置换"(只摧毁"哪只股票拿哪个值",保留时序路径与换手)。
    reason: >-
      逐日独立打乱同时摧毁时序路径:零样本日换手 0.85,真实因子 0.009,
      低换手因子在收益类指标上自动"超越零分布",比较的是手续费而非选股能力。首批结果(BATCH01)据此撤回。
    affects: >-
      H1、H2(原文"零分布 95 分位")
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: 4ab2a8c
    change: >-
      基准收益改为与组合同一时段"开盘→次日开盘"(原为基准"前收→当日收盘",与组合只在 t 日盘中重叠);
      旧口径另存 *_cc_legacy 仅作对照。
    reason: >-
      时段错位虚增超额方差、系统性压低超额夏普:实测中证1000 对中证500 跟踪误差 16.3% → 7.0%,
      超额方差的 81.5% 来自错位。该缺陷发现于看过结果之后;修正对全部因子与零分布一律生效,门槛数值不变。
    affects: >-
      H2(相对中证500 的超额夏普)
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: a15a404
    change: >-
      (1) 零分布改为按生命周期(首/末有效日)分组、组内循环错位指派的固定 donor,整条序列照搬;
      新增零分布有效性闸门:零样本换手中位数 / 真实换手须在 [0.8, 1.25],否则主判据按不通过处理。
      (2) "超越零分布 95 分位"改为 Phipson-Smyth 经验 p 值 (1 + 零样本不劣于真实值的个数) / (n + 1) ≤ 0.05。
      (3) 合同 v2:涨跌停价按分四舍五入后判定;创业板 2020-08-24 前涨跌幅 10%;
      卖出印花税按日期取值(2023-08-28 前 0.1%);退市时仍未卖出的持仓按 delisting_haircut=1.0 清算。
    reason: >-
      第二版构造(整列置换 + 逐行恢复缺失)在真实数据上退化为近似逐日打乱,零样本换手为真实的 2.2–13.4 倍;
      插值 q95 判据在 n=50 时单指标假阳性约 6.8%;合同 v1 四处交易规则均偏乐观
      (2019 年主板一字涨停漏判约 41%、改革前创业板涨跌停全漏、印花税低估覆盖样本 89.5% 的交易日、退市持仓零损失)。
    affects: >-
