# 任务卡 01 · 横盘吸筹 → 放量突破
task_id: task01_accumulation_breakout
name: 横盘吸筹→放量突破
category: 量价形态
status: open

core_question:
  - 主力在横盘期悄悄吸筹、随后放量突破箱顶,这个形态是否具有横截面选股能力?
  - 还是说它只是"追涨"的换皮,在扣除 T+1 与涨停不可买之后一无所剩?

economic_rationale: >
  形态派的经典假设:低振幅+缩量的横盘意味着筹码被动换手枯竭(吸筹),
  随后的放量突破代表新增资金介入,价格脱离箱体后有惯性。
  可证伪的对立假设:该形态只是"近期强势"的代理,收益全部来自动量;
  或突破当日多为涨停,T+1 下根本买不进,纸面收益无法兑现。

allowed_data: [close, open, high, low, volume, turn, adj_close, float_mcap]

known_dead_ends:
  - 参考实现(AB-Screener,GitHub 公开项目)自述"已有研究 FAIL / 证据不足",
    且其股票池存在幸存者偏差——即其正面结果不可采信,须独立重验。
  - 主力资金流数据本机不可得(东财源被拦),原方案的"资金层"以量能/换手代替,
    这是与原版的实质差异,须在结论中披露。

hypotheses:                      # 拉数据前写死,不得事后调整
  H1: 该因子的 RankIC 超越零分布 95 分位(即具有真实截面选股能力)
  H2: 多头组相对中证500 的超额夏普超越零分布 95 分位
  H3: 扣除"突破日一字涨停不可买"后,超额收益衰减不超过一半
falsification: >
  H1 或 H2 任一不成立 → 该形态在本口径下不具可交易的截面选股能力;
  H3 不成立 → 纸面收益主要来自买不进的涨停股,结论为"形态真但不可交易"。

notes: >
  本卡的价值不在于"证明它有效",而在于用统一门槛给一个流行形态一个可复核的裁定。
  负结果同样是交付物。

trials_declared:             # 须计入 gates.evaluate 的 n_trials
  # 参数(BOX_WIN=60/LONG_WIN=120/VOL_CAP=5/四项权重)沿用参考实现,本平台未做扫描,计 1 档。
  # 参考实现自身试过多少组参数不可知——这部分多重检验代价无法计入,在结论中披露。
  preregistered: 1

amendments:                  # 方法修订记录:只追加,不改假设原文
  - date: "2026-09-21"
    kind: method_change
    commit: 1dffd28
    change: >-
      零分布构造由"逐日截面独立打乱"改为"全样本固定股票置换"(只摧毁"哪只股票拿哪个值",保留时序路径与换手)。
    reason: >-
      逐日独立打乱同时摧毁时序路径:零样本日换手 0.85,真实因子 0.009,
      低换手因子在收益类指标上自动"超越零分布",比较的是手续费而非选股能力。首批结果(BATCH01)据此撤回。
    affects: >-
      H1、H2(原文"零分布 95 分位")
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: 4ab2a8c
    change: >-
      基准收益改为与组合同一时段"开盘→次日开盘"(原为基准"前收→当日收盘",与组合只在 t 日盘中重叠);
      旧口径另存 *_cc_legacy 仅作对照。
    reason: >-
      时段错位虚增超额方差、系统性压低超额夏普:实测中证1000 对中证500 跟踪误差 16.3% → 7.0%,
      超额方差的 81.5% 来自错位。该缺陷发现于看过结果之后;修正对全部因子与零分布一律生效,门槛数值不变。
    affects: >-
      H2(相对中证500 的超额夏普)与 H3 的超额衰减
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
  - date: "2026-09-21"
    kind: method_change
    commit: a15a404
    change: >-
      (1) 零分布改为按生命周期(首/末有效日)分组、组内循环错位指派的固定 donor,整条序列照搬;
      新增零分布有效性闸门:零样本换手中位数 / 真实换手须在 [0.8, 1.25],否则主判据按不通过处理。
      (2) "超越零分布 95 分位"改为 Phipson-Smyth 经验 p 值 (1 + 零样本不劣于真实值的个数) / (n + 1) ≤ 0.05。
      (3) 合同 v2:涨跌停价按分四舍五入后判定;创业板 2020-08-24 前涨跌幅 10%;
      卖出印花税按日期取值(2023-08-28 前 0.1%);退市时仍未卖出的持仓按 delisting_haircut=1.0 清算。
    reason: >-
      第二版构造(整列置换 + 逐行恢复缺失)在真实数据上退化为近似逐日打乱,零样本换手为真实的 2.2–13.4 倍;
      插值 q95 判据在 n=50 时单指标假阳性约 6.8%;合同 v1 四处交易规则均偏乐观
      (2019 年主板一字涨停漏判约 41%、改革前创业板涨跌停全漏、印花税低估覆盖样本 89.5% 的交易日、退市持仓零损失)。
    affects: >-
      H1、H2 的零校准判据与 H2、H3 所用的全部回测指标
    handling: 假设原文不改;判据按修正后的方法执行;复跑已计入 n_trials。
